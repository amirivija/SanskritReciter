# Deploy docs/ (learning packs) to GitHub Pages.
# Prerequisite: repo Settings → Pages → Source = "GitHub Actions"
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure docs catalog exists
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          if [ ! -f docs/index.html ]; then
            echo '<!DOCTYPE html><meta charset=utf-8><title>SanskritReciter</title><p>No packs yet. Run <code>./sr publish …</code></p>' > docs/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions source) if not yet configured on the repo
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
